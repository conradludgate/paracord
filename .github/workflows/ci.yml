name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.73.0
      - run: cargo check --locked -p paracord
      - run: cargo check --locked -p paracord --all-features

  miri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - model: stacked
            flags: -Zmiri-strict-provenance
          - model: tree
            flags: -Zmiri-strict-provenance -Zmiri-tree-borrows
    name: Key safety (${{ matrix.model }})
    env:
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: miri, rust-src
      - run: cargo miri test --locked -p paracord --test custom_key_resolution --features serde
      - run: cargo miri test --locked -p paracord --lib serde --features serde
